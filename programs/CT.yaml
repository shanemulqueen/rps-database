state: CT
name: Connecticut
last_reviewed: 2026-06-23
reviewer_notes: >
  Full review (CT revamp template). Corrected Class I schedule note — Public Act 23-102
  (2023) reduced Class I by 7 points for 2026–2030 (32%→25% in 2026, settling at ~29% by
  2030), reversing the prior PA 18-50 climb toward 40%. Added Class III (4% CHP + C&LM
  standard) via supplemental_data. Class II requirement is 4% (confirmed via PURA RPS
  overview). Added concise note_short fields for the consolidated eligibility matrix.
  Values verified against CT PURA / statute, not against LBNL (which is only a starting
  baseline, not authoritative).


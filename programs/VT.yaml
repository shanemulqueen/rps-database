state: VT
name: Vermont
last_reviewed: 2026-04-23
reviewer_notes: Initial build. Vermont's program is the Renewable Energy Standard (RES),
  not an RPS — structured as five tiers after Act 179 (2024), not program classes.
  Tier III covers energy transformation (electrification, efficiency, fuel switching)
  rather than generation, which is unique. Act 179 (2024) was passed over a governor
  veto. Standard Offer program is a separate feed-in tariff for small renewables (≤2.2 MW).

admin_authority:
  name: VT Public Utility Commission (PUC)
  url: https://puc.vermont.gov/electric/renewable-energy-standard

secondary_authority:
  name: VT Department of Public Service (DPS)
  url: https://publicservice.vermont.gov/renewables/renewable-energy-standard

rec_registry:
  name: NEPOOL GIS
  url: https://nepoolgis.com/

compliance_reports:
  - label: RES Annual Reports (DPS)
    url: https://publicservice.vermont.gov/about-us/plans-and-reports/renewable-energy-standard-reports
  - label: RES Rules (PUC Rule 4.400)
